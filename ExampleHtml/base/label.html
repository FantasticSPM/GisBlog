<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="../../Cesium/Widgets/widgets.css" />
    <script src="../../ExampleHtml/js/init.js"></script>
    <title>标签label</title>
    <style>
      html,
      body {
        height: 100%;
      }

      * {
        margin: 0;
      }

      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <script>
      const viewer = initViewer("map");
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(115.50731580886364, 39.13386753870255, 1000000),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch: Cesium.Math.toRadians(-90),
          roll: 0.0,
        },
      });

      //标签
      const label = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          115.2696789423176,
          39.66204318287304,
          0
        ),
        label: {
          text: "欢迎来到GIS LIU的技术博客",
          font: "20px sans-serif",
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 3,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          // pixelOffset: new Cesium.Cartesian2(0, -20),//偏移
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,//贴地
        }
      });

      //标签1
      const label1 = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          116.15565882406457,
          38.06273188699592,
          0
        ),
        label:{
          text:"共同探索cesium的奥秘",
          font:"30px sans-serif",
          style:Cesium.LabelStyle.FILL_AND_OUTLINE,
          outlineColor:Cesium.Color.RED,
          showBackground:true,//显示背景
          backgroundColor:Cesium.Color.fromCssColorString("#ccc").withAlpha(0.5),
          backgroundPadding:new Cesium.Cartesian2(50,10),
          heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
          outlineWidth:3,
        }
      })

      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      const a = [];
      handler.setInputAction((movement) => {
        const cartesian = viewer.scene.pickPosition(movement.position);
        const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
        const longitude = Cesium.Math.toDegrees(cartographic.longitude);
        const latitude = Cesium.Math.toDegrees(cartographic.latitude);
        a.push([longitude, latitude]);
        const height = cartographic.height;
        console.log(a);
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    </script>
  </body>
</html>
