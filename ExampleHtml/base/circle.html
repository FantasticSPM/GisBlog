<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="../../Cesium/Widgets/widgets.css" />
    <script src="../../ExampleHtml/js/init.js"></script>
    <title>圆</title>
    <style>
      html,
      body {
        height: 100%;
      }

      * {
        margin: 0;
      }

      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <script>
      const viewer = initViewer("map");
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees((115.50731580886364, 39.13386753870255, 1000000)),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch: Cesium.Math.toRadians(-90),
          roll: 0.0,
        },
      });

      //圆
      const circle = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          115.2696789423176,
          39.66204318287304,
          0
        ),
        point: {
          pixelSize: 10,
          color: Cesium.Color.BLUE,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        },
        ellipse:{
          semiMinorAxis: 100000,//短轴
          semiMajorAxis: 100000,//长轴
          material: Cesium.Color.BLUE.withAlpha(0.5),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, //贴地
          height:100,//高度,在贴地模式下无效
        }
      });

      //椭圆
      const circle2 = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          116.15565882406457,
          38.06273188699592,
          0
        ),
        point: {
          pixelSize: 10,
          color: Cesium.Color.RED,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        },
        ellipse:{
          semiMinorAxis: 50000,//短轴
          semiMajorAxis: 100000,//长轴
          material: Cesium.Color.RED.withAlpha(0.5),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, //贴地
          height:100,//高度,在贴地模式下无效
        }
      });
    </script>
  </body>
</html>
