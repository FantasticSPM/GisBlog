<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="../../Cesium/Widgets/widgets.css" />
    <script src="../../ExampleHtml/js/init.js"></script>
    <title>标牌billboard</title>
    <style>
      html,
      body {
        height: 100%;
      }

      * {
        margin: 0;
      }

      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <script>
      const viewer = initViewer("map");
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(115.50731580886364, 39.13386753870255, 1000000),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch: Cesium.Math.toRadians(-90),
          roll: 0.0,
        },
      });

      //圆
      const billboard = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          115.2696789423176,
          39.66204318287304,
          0
        ),
        billboard: {
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,//垂直对齐方式
          horizontalOrigin: Cesium.HorizontalOrigin.CENTER,//水平对齐方式
          image: "../../ExampleHtml/images/common/Cesium_Logo_Color.jpg",
          scale: 0.3,//缩放
        }
      });

      const billboard1 = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          116.15565882406457,
          38.06273188699592,
          0
        ),
        billboard: {
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,//垂直对齐方式
          horizontalOrigin: Cesium.HorizontalOrigin.CENTER,//水平对齐方式
          image: "../../images/logo.png",
          scale: 0.8,//缩放
        }
      })

      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      const a = [];
      handler.setInputAction((movement) => {
        const cartesian = viewer.scene.pickPosition(movement.position);
        const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
        const longitude = Cesium.Math.toDegrees(cartographic.longitude);
        const latitude = Cesium.Math.toDegrees(cartographic.latitude);
        a.push([longitude, latitude]);
        const height = cartographic.height;
        console.log(a);
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    </script>
  </body>
</html>
